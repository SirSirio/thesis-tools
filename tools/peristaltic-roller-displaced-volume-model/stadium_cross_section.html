<!DOCTYPE html>
<!--
================================================================================
  PERISTALTIC TUBE — FLATTENED LUMEN CROSS-SECTION (STADIUM MODEL)
  Export for further development in Claude Code / VS Code.
  Unstyled by design — geometry, physics and SVG logic only.
================================================================================

  WHAT THIS ARTIFACT SHOWS
  ------------------------
  An interactive cross-sectional view of a peristaltic pump tube as a single
  roller flattens it against a rigid backing wall. Three compression states are
  selectable:

      State 0 — No contact      : circular lumen, tube untouched.
      State 1 — Walls kiss      : lumen pinched to zero (occlusion onset).
      State 2 — Compression fit : rubber crushed past kiss by interference δ.

  The undeformed lumen (left) is a circle. The deformed lumen (right) is a
  STADIUM: a rectangle capped by two semicircles. The transition between them is
  governed by ONE physical assumption — conservation of the inner-wall perimeter
  (see PHYSICS below).

  This view is the geometric companion to the displaced-volume model. It exists
  to make the "occlusion is local, not a percentage of tube length" point
  visible, and to give a defensible residual-lumen AREA instead of a hand-waved
  occlusion percentage.

================================================================================
  SYMBOLS
================================================================================

  d       = tube inner diameter (ID)                         [mm]
  r0      = undeformed lumen radius = d/2                     [mm]
  wall    = tube wall thickness                              [mm]
  OD      = outer diameter = d + 2*wall                      [mm]
  delta   = radial interference (crush past wall-kiss)        [mm]
  G       = printed roller-to-backing gap = 2*wall - delta    [mm]
  h       = residual inner-wall separation under roller       [mm]
  L_w     = flat (straight) width of the stadium lumen        [mm]
  P       = inner-wall perimeter = pi*d  (CONSERVED)          [mm]
  A0      = undeformed lumen area = pi*r0^2                    [mm^2]
  A       = deformed (stadium) lumen area                     [mm^2]

================================================================================
  PHYSICS — WHY A STADIUM, AND WHY PERIMETER IS CONSERVED
================================================================================

  Elastomer tube walls (soft PVC here) are very nearly INCOMPRESSIBLE in bulk:
  squeezing the tube does not change the volume of the rubber, it redistributes
  it. For a thin-walled tube viewed in cross-section, the consequence is that
  the INNER WALL CONTOUR keeps (to first order) the same arc length as it
  changes shape. The circle of circumference P = pi*d is "unrolled" into a
  flatter closed curve of the SAME length P.

  The minimum-bending, physically natural shape that closed curve relaxes into,
  when pressed between two parallel flats separated by a distance h, is a
  STADIUM (a.k.a. discorectangle): two straight segments of length L_w joined by
  two semicircular caps of diameter h. This is exactly the shape a flattened
  closed loop of fixed length takes between two plates — the straight parts hug
  the plates, the caps turn the corners with the smallest possible curvature.

  Perimeter bookkeeping for a stadium:

      P = 2*L_w + (perimeter of one full circle of diameter h)
      P = 2*L_w + pi*h

  Solving for the flat width:

      L_w = (P - pi*h) / 2 = (pi*d - pi*h) / 2 = (pi/2)(d - h)

  As the roller closes (h decreasing from d down to 0):
      - h = d   -> L_w = 0      -> the stadium IS the original circle.
      - h -> 0  -> L_w -> P/2    -> a flat slit of length pi*d/2, zero area.

  This single relation replaces "occlusion %": at any squeeze, the residual
  lumen has a well-defined AREA computed from geometry, not assumed.

================================================================================
  GEOMETRY — AREA OF THE FLATTENED LUMEN
================================================================================

  A stadium of straight-width L_w and cap-diameter h has area:

      A = (rectangle)        +  (two semicircle caps = one full circle)
      A = L_w * h            +  pi * (h/2)^2

  Substituting L_w = (pi/2)(d - h):

      A(h) = (pi/2)(d - h) * h  +  pi * h^2 / 4
           = (pi/2) d h  -  (pi/2) h^2  +  (pi/4) h^2
           = (pi/2) d h  -  (pi/4) h^2

  Checks:
      A(d)  = (pi/2) d^2 - (pi/4) d^2 = (pi/4) d^2 = A0     (circle recovered)
      A(0)  = 0                                            (full occlusion)

  So residual lumen area is a smooth, monotonic function of the residual gap h,
  bounded by the open circle at one end and full closure at the other. This is
  the quantity the artifact reports in its "lumen area now" readout.

  NOTE ON FIDELITY: the stadium is a first-order idealisation. Real flattened
  PVC develops slight wall thinning and the caps are not perfect semicircles
  under load. Treat A(h) as a clean reference geometry; empirical correction
  (the k factor in the companion displaced-volume model) handles the rest.

================================================================================
  MAPPING SQUEEZE STATE -> RESIDUAL GAP h
================================================================================

  The artifact needs an h for each state in order to draw the stadium. The
  mapping used here is deliberately simple and monotonic; it is a VISUAL model
  of how the lumen closes as the printed gap G shrinks from OD down to 2*wall:

      State 0 (no contact):   h = d
      State 1 (walls kiss):   h = 0
      State 2 (compression):  linear interpolation on the gap —
                                  if  G >= OD       : h = d
                                  if  G <= 2*wall   : h = 0
                                  else              : h = d * (G - 2*wall)/(OD - 2*wall)
                              with G = 2*wall - delta, so any delta>0 gives h=0
                              (full occlusion), and the partial regime is what
                              you see while dragging delta toward 0.

  This is a presentation mapping for the figure, NOT a stress-strain law. The
  physically load-bearing relations are the perimeter conservation and the area
  formula above; those are what you cite.

================================================================================
  THE GAP EQUATION (carried over from the squeeze model, for context)
================================================================================

      No contact:        G = OD     = d + 2*wall
      Walls kiss:         G = 2*wall            (ID drops out at occlusion)
      Compression fit:    G = 2*wall - delta

  delta is the safety margin against wall-thickness / print tolerance that
  guarantees full occlusion. Recommended soft-PVC band delta = 0.10–0.20 x
  (2*wall). delta > ~2*wall = crushing wall material (fatigue / ID-drift risk).

================================================================================
  PARAMETER VALUES & SOURCES
================================================================================

  d     : 0.51 mm selected (Masterflex Ismatec Puri-Clear LL, 2-stop microbore).
          Range 0.25–1.14 mm. Source: Ismatec/Masterflex Pump Tubing Selection
          Guide (Cole-Parmer 14-035 Rev C); Darwin Microfluidics product page.

  wall  : 0.85 mm default. 2-stop microbore wall is ~constant (~0.85–0.91 mm)
          across small IDs — sized to the Ismatec cartridge, not the bore.
          Confirmed: platinum-cured silicone 2-stop 0.89 ID / 2.59 OD ->
          wall = 0.85 mm (Cole-Parmer MFLX06421-26). MEASURE actual Puri-Clear
          LL OD in Proto 0; manufacturer does not publish PVC 2-stop OD.

  delta : 0.10–0.20 x (2*wall). Industry occlusion band "10–20%, higher for
          softer tube" — Pump Industry Magazine (2014). Occlusion onset
          constraint (gap < 2x wall) — Boxer Pumps, "Peristaltic Pumps for
          Liquid".

================================================================================
  SVG RENDERING NOTES (for whoever maintains the figure)
================================================================================
  - PXMM scales mm -> screen px for the deformed view (left circle uses its own
    fixed scale so both panels read at sensible sizes).
  - stadiumPath(yc, halfWidth, halfHeight) returns an SVG path for a horizontal
    stadium centred at (cx, yc). When halfHeight <= ~0.5 px it degenerates to a
    flat line (full occlusion).
  - Two nested stadiums are drawn: outer = lumen + wall thickness, inner = lumen.
  - The roller (circle) sits tangent to the outer top edge; the backing wall is
    a thick line tangent to the outer bottom edge.
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peristaltic tube flattened cross-section (stadium model)</title>
</head>
<body>

<h1>Flattened lumen cross-section — stadium model</h1>

<!-- ============================ STATE BUTTONS ============================ -->
<fieldset>
  <legend>Compression state</legend>
  <button id="s0" onclick="setState(0)">No contact</button>
  <button id="s1" onclick="setState(1)">Walls kiss (occlusion)</button>
  <button id="s2" onclick="setState(2)">Compression fit</button>
</fieldset>

<!-- ============================ INPUTS ============================ -->
<fieldset>
  <legend>Inputs</legend>
  <label>Wall (mm):
    <input type="range" id="w" min="0.4" max="1.2" step="0.05" value="0.85" oninput="draw()">
    <output id="w-out">0.85</output>
  </label><br>
  <label>ID d (mm):
    <input type="range" id="d" min="0.25" max="1.14" step="0.01" value="0.51" oninput="draw()">
    <output id="d-out">0.51</output>
  </label><br>
  <label>Interference δ (mm):
    <input type="range" id="i" min="0" max="0.6" step="0.01" value="0.27" oninput="draw()">
    <output id="i-out">0.27</output>
  </label>
</fieldset>

<!-- ============================ OUTPUTS ============================ -->
<fieldset>
  <legend>Outputs</legend>
  <p>Print this gap G = 2·wall − δ = <output id="gap">—</output> mm</p>
  <p>Residual gap h = <output id="resid">—</output> mm</p>
  <p>Flat width L_w = <output id="lw">—</output> mm</p>
  <p>Lumen area A = <output id="area">—</output> mm² (<output id="area-pct">—</output>% of open)</p>
</fieldset>

<!-- ============================ FIGURE ============================ -->
<svg id="fig" width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
  <text x="165" y="34" text-anchor="middle" font-size="13">Undeformed</text>
  <text x="490" y="34" text-anchor="middle" font-size="13">Under roller</text>

  <!-- Undeformed panel (left) -->
  <circle id="u-outer" cx="165" cy="150" r="80" fill="#F5C4B3" fill-opacity="0.5" stroke="#993C1D" stroke-width="1.5"/>
  <circle id="u-lumen" cx="165" cy="150" r="42" fill="#85B7EB" fill-opacity="0.5" stroke="#185FA5" stroke-width="1.5"/>
  <line id="u-id-l" x1="165" y1="108" x2="165" y2="192" stroke="#185FA5" stroke-width="1"/>
  <text x="178" y="154" font-size="12" fill="#0C447C">ID</text>
  <line x1="165" y1="70" x2="165" y2="108" stroke="#993C1D" stroke-width="1"/>
  <text x="178" y="92" font-size="12" fill="#993C1D">wall</text>

  <!-- Deformed panel (right), drawn by JS -->
  <g id="flat-group"></g>
</svg>

<script>
/* ----------------------------------------------------------------------------
   GEOMETRY MODEL — pure functions. See header for derivations.
---------------------------------------------------------------------------- */

// Conserved inner-wall perimeter: P = pi * d
function perimeter(d) { return Math.PI * d; }

// Flat width of stadium from conserved perimeter: L_w = (P - pi*h)/2
function flatWidth(d, h) { return Math.max(0, (perimeter(d) - Math.PI * h) / 2); }

// Stadium area: A = L_w*h + pi*(h/2)^2   (equivalently (pi/2)d h - (pi/4)h^2)
function stadiumArea(d, h) {
  const L_w = flatWidth(d, h);
  return L_w * h + Math.PI * (h / 2) * (h / 2);
}

// Printed gap: G = 2*wall - delta
function printedGap(wall, delta) { return 2 * wall - delta; }

// Map squeeze state -> residual gap h (presentation mapping, see header).
function residualGap(state, d, wall, delta) {
  if (state === 0) return d;
  if (state === 1) return 0;
  const OD = d + 2 * wall;
  const G = printedGap(wall, delta);
  if (G >= OD) return d;
  if (G <= 2 * wall) return 0;
  return d * (G - 2 * wall) / (OD - 2 * wall);
}

/* ----------------------------------------------------------------------------
   STATE + RENDER
---------------------------------------------------------------------------- */
let state = 2;
const PXMM = 55;       // mm -> px scale for the deformed (right) panel
const SCALE_L = 60;    // mm -> px scale for the undeformed (left) circle

function setState(s) {
  state = s;
  if (s === 0) document.getElementById('i').value = 0;
  if (s === 1) document.getElementById('i').value = 0;
  if (s === 2 && parseFloat(document.getElementById('i').value) === 0) {
    document.getElementById('i').value = 0.27;
  }
  draw();
}

// Build an SVG path for a horizontal stadium centred at (cx, yc).
function stadiumPath(cx, yc, halfWidth, halfHeight) {
  const x1 = cx - halfWidth, x2 = cx + halfWidth;
  const yT = yc - halfHeight, yB = yc + halfHeight;
  if (halfHeight <= 0.5) return 'M ' + x1 + ' ' + yc + ' L ' + x2 + ' ' + yc;
  return 'M ' + x1 + ' ' + yT + ' L ' + x2 + ' ' + yT +
         ' A ' + halfHeight + ' ' + halfHeight + ' 0 0 1 ' + x2 + ' ' + yB +
         ' L ' + x1 + ' ' + yB +
         ' A ' + halfHeight + ' ' + halfHeight + ' 0 0 1 ' + x1 + ' ' + yT + ' Z';
}

function draw() {
  const NS = 'http://www.w3.org/2000/svg';
  const wall  = parseFloat(document.getElementById('w').value);
  const d     = parseFloat(document.getElementById('d').value);
  let   delta = parseFloat(document.getElementById('i').value);
  if (state < 2) delta = 0;

  document.getElementById('w-out').value = wall.toFixed(2);
  document.getElementById('d-out').value = d.toFixed(2);
  document.getElementById('i-out').value = delta.toFixed(2);

  const r0 = d / 2;
  const A0 = Math.PI * r0 * r0;
  const G  = printedGap(wall, delta);
  const h  = residualGap(state, d, wall, delta);
  const L_w = flatWidth(d, h);
  let area = stadiumArea(d, h);
  if (state === 0) area = A0;

  document.getElementById('gap').value      = G.toFixed(2);
  document.getElementById('resid').value    = h.toFixed(3);
  document.getElementById('lw').value       = L_w.toFixed(3);
  document.getElementById('area').value     = area.toFixed(3);
  document.getElementById('area-pct').value = (area / A0 * 100).toFixed(0);

  // --- Undeformed circle (left), scaled to current ID/wall ---
  document.getElementById('u-lumen').setAttribute('r', Math.max(8, r0 * SCALE_L));
  document.getElementById('u-outer').setAttribute('r', Math.max(8, (r0 + wall) * SCALE_L));
  document.getElementById('u-id-l').setAttribute('y1', 150 - r0 * SCALE_L);
  document.getElementById('u-id-l').setAttribute('y2', 150 + r0 * SCALE_L);

  // --- Deformed stadium (right) ---
  const g = document.getElementById('flat-group');
  g.innerHTML = '';
  const cx = 490, cy = 150;
  const capR  = (h * PXMM) / 2;
  const halfL = (L_w * PXMM) / 2;
  const wpx   = wall * PXMM;
  const outerHalfH = capR + wpx;
  const outerHalfL = halfL;

  // Outer stadium = lumen + wall
  const outer = document.createElementNS(NS, 'path');
  outer.setAttribute('d', stadiumPath(cx, cy, outerHalfL + wpx, outerHalfH));
  outer.setAttribute('fill', '#F5C4B3'); outer.setAttribute('fill-opacity', '0.5');
  outer.setAttribute('stroke', '#993C1D'); outer.setAttribute('stroke-width', '1.5');
  g.appendChild(outer);

  // Inner lumen stadium (or flat slit at full occlusion)
  if (h > 0.001) {
    const inner = document.createElementNS(NS, 'path');
    inner.setAttribute('d', stadiumPath(cx, cy, halfL, capR));
    inner.setAttribute('fill', '#85B7EB'); inner.setAttribute('fill-opacity', '0.55');
    inner.setAttribute('stroke', '#185FA5'); inner.setAttribute('stroke-width', '1.5');
    g.appendChild(inner);
  } else {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', cx - outerHalfL); line.setAttribute('y1', cy);
    line.setAttribute('x2', cx + outerHalfL); line.setAttribute('y2', cy);
    line.setAttribute('stroke', '#185FA5'); line.setAttribute('stroke-width', '2');
    g.appendChild(line);
  }

  // Roller tangent to outer top edge
  const rollerR = 70;
  const rollerCy = cy - outerHalfH - rollerR + (state === 2 ? Math.min(wpx, delta * PXMM) : 0);
  const roller = document.createElementNS(NS, 'circle');
  roller.setAttribute('cx', cx); roller.setAttribute('cy', rollerCy); roller.setAttribute('r', rollerR);
  roller.setAttribute('fill', '#B5D4F4'); roller.setAttribute('fill-opacity', '0.35');
  roller.setAttribute('stroke', '#185FA5'); roller.setAttribute('stroke-width', '1.5');
  g.appendChild(roller);
  const rl = document.createElementNS(NS, 'text');
  rl.setAttribute('x', cx); rl.setAttribute('y', rollerCy);
  rl.setAttribute('text-anchor', 'middle'); rl.setAttribute('dominant-baseline', 'central');
  rl.setAttribute('font-size', '13'); rl.setAttribute('fill', '#0C447C');
  rl.textContent = 'roller'; g.appendChild(rl);

  // Backing wall tangent to outer bottom edge
  const backY = cy + outerHalfH + 6;
  const back = document.createElementNS(NS, 'line');
  back.setAttribute('x1', cx - 130); back.setAttribute('y1', backY);
  back.setAttribute('x2', cx + 130); back.setAttribute('y2', backY);
  back.setAttribute('stroke', '#993C1D'); back.setAttribute('stroke-width', '4');
  back.setAttribute('stroke-linecap', 'round');
  g.appendChild(back);
  const bl = document.createElementNS(NS, 'text');
  bl.setAttribute('x', cx); bl.setAttribute('y', backY + 20);
  bl.setAttribute('text-anchor', 'middle'); bl.setAttribute('font-size', '12'); bl.setAttribute('fill', '#993C1D');
  bl.textContent = 'backing wall'; g.appendChild(bl);

  // Residual-gap dimension marker (only when lumen is open)
  if (h > 0.02) {
    const dx = cx + outerHalfL + wpx + 24;
    const dl = document.createElementNS(NS, 'line');
    dl.setAttribute('x1', dx); dl.setAttribute('y1', cy - capR);
    dl.setAttribute('x2', dx); dl.setAttribute('y2', cy + capR);
    dl.setAttribute('stroke', '#185FA5'); dl.setAttribute('stroke-width', '1');
    g.appendChild(dl);
    [cy - capR, cy + capR].forEach(function (yy) {
      const t = document.createElementNS(NS, 'line');
      t.setAttribute('x1', dx - 4); t.setAttribute('y1', yy);
      t.setAttribute('x2', dx + 4); t.setAttribute('y2', yy);
      t.setAttribute('stroke', '#185FA5'); t.setAttribute('stroke-width', '1');
      g.appendChild(t);
    });
    const tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', dx + 8); tx.setAttribute('y', cy + 4);
    tx.setAttribute('font-size', '12'); tx.setAttribute('fill', '#185FA5');
    tx.textContent = 'h'; g.appendChild(tx);
  }
}

setState(2);
</script>

</body>
</html>
