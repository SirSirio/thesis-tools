    /* ── 6b · The next-state preview ───────────────────────────────

       the next press, once that step's motion has settled? A static clone with
       the fragments ticked on cannot answer it, because almost every slide is
       driven by a GSAP timeline, so the target state is rebuilt instead:

         · the target is this slide at step n+1 while fragments are left,
           otherwise the next slide at step 0, and "end of deck" past the last;
         · the clone is built from a pristine snapshot, never from the live
           slide, because several builders read inline left/top/width/height as
           their home geometry and the live slide's are mid-animation;
         · the slide's registered builder runs on the clone, the returned
           timeline is seeked to the target label, and the entrance hook runs
           after it, exactly as a real entry would leave the slide;
         · everything the two of them started is then fast-forwarded to its end
           and killed, so the clone holds final styles and nothing keeps ticking
           behind the panel.

       The builder and the hook run inside a gsap.context scoped to the clone,
       so the next render reverts the previous one. Nothing here may touch the
       live stage: builders scope every selector to their element, which is why
       the clone may keep the ids the parts' #sNN CSS depends on. */

       tweens, and anything else started outside the preview timeline. Three
       things are deliberately left alone, because touching them would undo the
       seek:
         · the timeline itself, which is holding the target state;
         · its children, which the seek already rendered where they belong —
           finishing one would drag a future step onto the clone;
         · anything already at its end, above all the builder's opening
           gsap.set() calls, which would re-apply the slide's rest state. */
    function settlePreview(ctx, tl, clone) {
      var list = [];
      /* Walk the parent chain rather than ask the timeline for its children:
         a stagger wraps its tweens in a sub-timeline that getChildren does not
         hand back, and finishing one of those would reveal the next step. */
      function ownedByTimeline(a) {
        for (var p = a, i = 0; p && i < 64; p = p.parent, i++) if (p === tl) return true;
        return false;
      }
      function add(a) {
        if (!a || a === tl || ownedByTimeline(a)) return;
        try { if (!a.totalProgress || a.totalProgress() >= 1) return; } catch (e) { return; }
        if (list.indexOf(a) < 0) list.push(a);

      if (ctx && ctx.data) ctx.data.forEach(add);
      var running = [];
      try { running = window.gsap.globalTimeline.getChildren(true, true, true); } catch (e) {}

      list.forEach(function (a) {

      });

         tick flushes the queue; it advances the live stage by the frame it was
         going to advance by anyway, and only then is it safe to kill. */
      try { window.gsap.ticker.tick(); } catch (e) {}
      list.forEach(function (a) { try { a.kill(); } catch (e) {} });

      clone.querySelectorAll('iframe').forEach(function (n) { n.parentNode.removeChild(n); });

        v.muted = true;
      });
      clone.querySelectorAll('img[data-src]').forEach(function (im) {
        if (!im.getAttribute('src')) im.src = im.getAttribute('data-src');
      });
      /* In the document before the builder runs, so anything that measures or
         draws an SVG length sees a laid-out element. */
      host.appendChild(clone);

      var fn    = (cue && window.Deck.builderFor) ? window.Deck.builderFor(cue) : null;
      var hooks = (cue && window.Deck.entersFor)  ? window.Deck.entersFor(cue)  : [];
      if (!window.gsap || (!fn && !hooks.length)) return;

      var tl = null;
      var ctx = window.gsap.context(function () {
        if (fn) {
          try { tl = fn(clone, window.gsap) || null; }
          catch (err) { console.error('[deck] preview builder failed for ' + cue, err); tl = null; }
        }
        if (tl) {
          try {
            tl.pause();
            var lbl = labelAt(tl, target);
            if (lbl !== null) tl.seek(lbl, false);
            else if (target > 0) tl.progress(1, false);
            forceRender(tl, tl.totalTime());
          } catch (err) { console.error('[deck] preview seek failed for ' + cue, err); }
        }
        hooks.forEach(function (h) {
          try { h(clone, window.gsap); }
          catch (err) { console.error('[deck] preview enter hook failed for ' + cue, err); }
        });
      }, clone);

      settlePreview(ctx, tl, clone);
      preview = { ctx: ctx, tl: null };
    }

    function updatePresenter(d) {
      if (view !== 'presenter') return;
      var el = slides[d.slide - 1];
      pres.count.textContent = d.slide + ' / ' + d.count;
      pres.step.textContent  = d.step + ' / ' + d.steps;
      var t = el.querySelector('.slide__title, .divider__title');
      pres.title.textContent = t ? t.textContent.trim() : (el.getAttribute('data-cue') || '');
      var notes = el.querySelector('aside.notes');
      pres.notes.innerHTML = notes ? notes.innerHTML
        : '<p class="pres__notes-empty">No notes for this slide.</p>';
      renderNext(d);
      tickClock();
    }

    /* ── 7 · Guest view ────────────────────────────────────────────── */

    var dotEl = null, dotTimer = null;
    function markLive() {
      if (!dotEl) return;
      dotEl.classList.add('is-live');
      clearTimeout(dotTimer);
      dotTimer = setTimeout(function () { dotEl.classList.remove('is-live'); }, 20000);
    }

    /* ── 8 · Sync ──────────────────────────────────────────────────── */

    var sid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    var seq = 0;
    var seen = Object.create(null);
    var bc = null;
    var pendingMsg = null, coalesce = null, lastSent = null;
    var booted = false;      /* the first state is the page's own, never pushed */
    var hasMoved = false;    /* this window has navigated at least once */

    function makeMsg(d) {
      return { v: 1, deck: DECK_ID, sid: sid, cue: d.cue, slide: d.slide, step: d.step, seq: ++seq, t: Date.now() };
    }

    function send(m) {
      lastSent = m;
      if (bc) { try { bc.postMessage(m); } catch (e) {} }
      if (syncRole === 'host') {
        try {
          fetch('https://ntfy.sh/' + TOPIC, { method: 'POST', body: JSON.stringify(m) })
            .catch(function () { /* the deck keeps working without the relay */ });
        } catch (e) {}
      }
    }

    var coalesceR = null, pendingRemote = null;
    /* A state this window applied from another window (the projector driven while the
       presenter window is the host, or the reverse) still goes to the relay, but never
       back onto the BroadcastChannel, or the two windows would echo each other. */
    function relayRemote(d) {
      pendingRemote = d;
      if (coalesceR) return;
      coalesceR = setTimeout(function () {
        coalesceR = null;
        var d2 = pendingRemote; pendingRemote = null;
        if (!d2) return;
        var m = makeMsg(d2); lastSent = m;
        try {
          fetch('https://ntfy.sh/' + TOPIC, { method: 'POST', body: JSON.stringify(m) })
            .catch(function () {});
        } catch (e) {}
      }, 120);
    }

    function broadcast(d) {
      if (d.remote) { if (syncRole === 'host') relayRemote(d); return; }
      if (!booted) { booted = true; return; }
      hasMoved = true;
      pendingMsg = d;
      if (coalesce) return;
      coalesce = setTimeout(function () {
        coalesce = null;
        var d2 = pendingMsg; pendingMsg = null;
        if (d2) send(makeMsg(d2));
      }, 120);
    }

    function applyRemote(m) {
      if (!m || m.deck !== DECK_ID) return;
      if (m.sid === sid) return;
      /* A window that has just opened asks where the talk is. Only a window
         that is actually driving answers, so two fresh windows cannot shove
         their own opening slide onto each other. */
      if (m.hello) {
        if (syncRole === 'host' || hasMoved) send(makeMsg(window.Deck.state));
        return;
      }
      if (m.t && Date.now() - m.t > 120000) return;
      var last = seen[m.sid];
      if (last !== undefined && m.seq <= last) return;
      seen[m.sid] = m.seq;
      markLive();
      if (m.cue && window.Deck.goToCue && window.Deck.goToCue(m.cue, m.step, true)) return;
      if (m.slide) window.Deck.goToState(m.slide, m.step, true);
    }

    function setupSync() {
      if ('BroadcastChannel' in window) {
        bc = new BroadcastChannel(CHANNEL);
        bc.onmessage = function (e) { applyRemote(e.data); };
        setTimeout(function () {
          try { bc.postMessage({ v: 1, deck: DECK_ID, sid: sid, hello: true, t: Date.now() }); } catch (e) {}
        }, 250);
      }
      if (syncRole === 'host') {
        setInterval(function () {
          var d = window.Deck.state;
          send(makeMsg(d));
        }, 15000);
      }
      if (syncRole === 'guest') {
        try {
          var es = new EventSource('https://ntfy.sh/' + TOPIC + '/sse?since=2m');
          es.onmessage = function (e) {
            try {
              var env = JSON.parse(e.data);
              if (env.event && env.event !== 'message') return;
              if (!env.message) return;
              applyRemote(JSON.parse(env.message));
            } catch (err) {}
          };
          es.onerror = function () { /* EventSource reconnects on its own */ };
        } catch (e) {}
      }
    }

    /* ── 9 · The state handler ─────────────────────────────────────── */

    function onState(d) {
      var idx = d.slide - 1;
      var el  = slides[idx];
      if (!el) return;
      var entering = idx !== prevIdx;

      if (entering) {
        if (prevIdx >= 0 && slides[prevIdx]) {
          var prevEl = slides[prevIdx];
          var prevTl = timelines.get(prevEl);
          if (prevTl) {
            if (prevTl.__tween) { prevTl.__tween.kill(); prevTl.__tween = null; }
            prevTl.pause();
          }
          pauseVideos(prevEl);
        }
        ensureMedia(idx);
      }

      buildTimeline(el);
      driveTimeline(el, d.step, entering);

      if (entering) {
        runEnterHooks(el);
        playVideos(el);
        prevIdx = idx;
      }

      updateMinimap(el);
      updatePresenter(d);
      broadcast(d);
    }

    /* ── 10 · Init ─────────────────────────────────────────────────── */

    function init() {
      slides   = Array.prototype.slice.call(document.querySelectorAll('.slide'));
      stage    = document.querySelector('.deck-stage');
      viewport = document.querySelector('.deck-viewport');
      dotEl    = document.querySelector('.guest-dot');
      if (!stage || !slides.length) return;

      renderMinimap();
      wireToolCards();
      if (view === 'stage') wireNavIdle();
      if (view === 'presenter') {
        /* Taken here, after the tool cards are furnished and before the first
           builder has run, so every preview clone starts from a virgin slide. */
        pristine = slides.map(function (s) { return s.cloneNode(true); });
        setupPresenter();
      }
      setupSync();

      document.addEventListener('deck:state', function (e) { onState(e.detail); });

      /* deck.js emitted its first state inside its own DOMContentLoaded
         handler, which ran before this one, so bootstrap from Deck.state. */
      onState(Object.assign({ remote: false }, window.Deck.state));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
